<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Arial, Helvetica, sans-serif">
    <title>Incident Command System organization chart</title>
    <g stroke="#bbbbbb" stroke-width="3" fill="none">
        <line x1="480" y1="134" x2="480" y2="340" />
        <line x1="480" y1="172" x2="560" y2="172" />
        <line x1="480" y1="228" x2="560" y2="228" />
        <line x1="480" y1="284" x2="560" y2="284" />
        <line x1="135" y1="340" x2="825" y2="340" />
        <line x1="135" y1="340" x2="135" y2="362" />
        <line x1="365" y1="340" x2="365" y2="362" />
        <line x1="595" y1="340" x2="595" y2="362" />
        <line x1="825" y1="340" x2="825" y2="362" />
    </g>

    <text x="480" y="44" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">Incident Command System (ICS)</text>

    <rect x="330" y="66" width="300" height="68" rx="10" fill="#e7ad52" />
    <text x="480" y="96" font-size="23" font-weight="bold" fill="#111111" text-anchor="middle">Incident Commander</text>
    <text x="480" y="121" font-size="16" fill="#111111" text-anchor="middle">In charge of the whole incident</text>

    <text x="455" y="220" font-size="21" font-weight="bold" fill="#6fd0de" text-anchor="end">Command Staff</text>
    <text x="455" y="244" font-size="16" fill="#cccccc" text-anchor="end">Helps the Incident Commander</text>

    <g font-size="17" fill="#ffffff">
        <rect x="560" y="150" width="360" height="44" rx="8" fill="#1f6f7d" />
        <text x="574" y="178"><tspan font-weight="bold">Public Information Officer</tspan> - the public</text>
        <rect x="560" y="206" width="360" height="44" rx="8" fill="#1f6f7d" />
        <text x="574" y="234"><tspan font-weight="bold">Safety Officer</tspan> - keeps responders safe</text>
        <rect x="560" y="262" width="360" height="44" rx="8" fill="#1f6f7d" />
        <text x="574" y="290"><tspan font-weight="bold">Liaison Officer</tspan> - other agencies</text>
    </g>

    <text x="30" y="328" font-size="21" font-weight="bold" fill="#8db8ea">General Staff</text>

    <g text-anchor="middle">
        <rect x="30" y="362" width="210" height="122" rx="10" fill="#2f5d8a" />
        <text x="135" y="392" font-size="22" font-weight="bold" fill="#ffffff">Operations</text>
        <text x="135" y="416" font-size="18" font-style="italic" fill="#e7ad52">The Doers</text>
        <text x="135" y="444" font-size="16" fill="#ffffff">Directs the people</text>
        <text x="135" y="465" font-size="16" fill="#ffffff">doing the work</text>

        <rect x="260" y="362" width="210" height="122" rx="10" fill="#2f5d8a" />
        <text x="365" y="392" font-size="22" font-weight="bold" fill="#ffffff">Planning</text>
        <text x="365" y="416" font-size="18" font-style="italic" fill="#e7ad52">The Thinkers</text>
        <text x="365" y="444" font-size="16" fill="#ffffff">Tracks what is happening</text>
        <text x="365" y="465" font-size="16" fill="#ffffff">and plans what is next</text>

        <rect x="490" y="362" width="210" height="122" rx="10" fill="#2f5d8a" />
        <text x="595" y="392" font-size="22" font-weight="bold" fill="#ffffff">Logistics</text>
        <text x="595" y="416" font-size="18" font-style="italic" fill="#e7ad52">The Getters</text>
        <text x="595" y="444" font-size="16" fill="#ffffff">Gets people, supplies,</text>
        <text x="595" y="465" font-size="16" fill="#ffffff">food, and equipment</text>

        <rect x="720" y="362" width="210" height="122" rx="10" fill="#2f5d8a" />
        <text x="825" y="392" font-size="22" font-weight="bold" fill="#ffffff">Finance/Admin</text>
        <text x="825" y="416" font-size="18" font-style="italic" fill="#e7ad52">The Payers</text>
        <text x="825" y="444" font-size="16" fill="#ffffff">Tracks money, time,</text>
        <text x="825" y="465" font-size="16" fill="#ffffff">and paperwork</text>
    </g>

    <text x="480" y="522" font-size="17" fill="#cccccc" text-anchor="middle">Each section is led by a Section Chief. Only the jobs that are needed get filled.</text>
</svg>
