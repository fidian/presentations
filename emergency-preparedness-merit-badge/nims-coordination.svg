<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Arial, Helvetica, sans-serif">
    <title>NIMS command and coordination: policy, support, and on-scene levels</title>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#e7ad52" />
        </marker>
    </defs>

    <text x="480" y="44" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">NIMS: Who Does What</text>

    <g stroke="#e7ad52" stroke-width="4" marker-end="url(#arrow)">
        <line x1="44" y1="446" x2="44" y2="94" />
        <line x1="96" y1="94" x2="96" y2="446" />
    </g>
    <text transform="translate(30 270) rotate(-90)" font-size="16" font-weight="bold" fill="#e7ad52" text-anchor="middle">Requests and information</text>
    <text transform="translate(120 270) rotate(90)" font-size="16" font-weight="bold" fill="#e7ad52" text-anchor="middle">Resources and priorities</text>

    <rect x="140" y="72" width="600" height="120" rx="10" fill="#5b3f86" />
    <text x="160" y="102" font-size="16" font-weight="bold" fill="#e0d0ff">POLICY</text>
    <text x="160" y="132" font-size="23" font-weight="bold" fill="#ffffff">Multiagency Coordination Group</text>
    <text x="160" y="158" font-size="17" fill="#ffffff">Elected officials and agency heads set priorities.</text>
    <text x="160" y="178" font-size="17" fill="#e0d0ff">Example: mayor, county board, agency directors</text>

    <rect x="140" y="202" width="600" height="120" rx="10" fill="#1f6f7d" />
    <text x="160" y="232" font-size="16" font-weight="bold" fill="#c8f2f8">COORDINATION AND SUPPORT</text>
    <text x="160" y="262" font-size="23" font-weight="bold" fill="#ffffff">Emergency Operations Center (EOC)</text>
    <text x="160" y="288" font-size="17" fill="#ffffff">Gathers information and finds people and supplies.</text>
    <text x="160" y="308" font-size="17" fill="#c8f2f8">Example: the county EOC, away from the scene</text>

    <rect x="140" y="332" width="600" height="120" rx="10" fill="#2f5d8a" />
    <text x="160" y="362" font-size="16" font-weight="bold" fill="#cfe2f8">ON SCENE</text>
    <text x="160" y="392" font-size="23" font-weight="bold" fill="#ffffff">Incident Command System (ICS)</text>
    <text x="160" y="418" font-size="17" fill="#ffffff">Runs the work at the Incident Command Post.</text>
    <text x="160" y="438" font-size="17" fill="#cfe2f8">Example: a fire chief as Incident Commander</text>

    <rect x="760" y="72" width="170" height="380" rx="10" fill="none" stroke="#e7ad52" stroke-width="3" />
    <g font-size="18" fill="#ffffff" text-anchor="middle">
        <text x="845" y="110" font-size="21" font-weight="bold" fill="#e7ad52">Joint</text>
        <text x="845" y="136" font-size="21" font-weight="bold" fill="#e7ad52">Information</text>
        <text x="845" y="162" font-size="21" font-weight="bold" fill="#e7ad52">System</text>
        <text x="845" y="222">Public</text>
        <text x="845" y="246">Information</text>
        <text x="845" y="270">Officers from</text>
        <text x="845" y="294">every level</text>
        <text x="845" y="318">agree on one</text>
        <text x="845" y="342">message for</text>
        <text x="845" y="366">the public.</text>
    </g>

    <text x="480" y="494" font-size="19" fill="#ffffff" text-anchor="middle">ICS runs the incident. NIMS connects everyone who supports it.</text>
    <text x="480" y="522" font-size="17" fill="#cccccc" text-anchor="middle">NIMS also shares resource management and communication standards.</text>
</svg>
